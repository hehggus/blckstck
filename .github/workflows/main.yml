name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Unpack ZIP Project
      run: |
        unzip project.zip
        TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
        if [ "$TARGET_DIR" != "." ]; then
          echo "Файлы найдены в подпапке $TARGET_DIR, переносим в корень..."
          mv $TARGET_DIR/* . 2>/dev/null || true
          mv $TARGET_DIR/.* . 2>/dev/null || true
        fi
        rm -f project.zip

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Vite Web Project
      run: npm run build

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'  # Обновили версию до Java 21, чтобы исправить ошибку компиляции

    - name: Install Capacitor CLI & Core
      run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

    - name: Initialize Capacitor
      run: npx cap init "My Tetris Game" "com.mycompany.tetris" --web-dir=dist

    - name: Add Android Platform
      run: npx cap add android

    - name: Copy Web Assets to Android Project
      run: npx cap copy android

    - name: Auto-accept Android SDK Licenses and Build APK
      run: |
        cd android
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
