name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Unpack ZIP Project
      run: |
        unzip project.zip
        # Если файлы были внутри папки, вытаскиваем их в корень
        if [ -d "tetris-main" ]; then mv tetris-main/* .; fi
        if [ -d "react-tetris-main" ]; then mv react-tetris-main/* .; fi
        rm project.zip

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Build Vite Web Project
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Capacitor CLI & Core
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor
      run: npx cap init "My Tetris Game" "com.mycompany.tetris" --web-dir=dist

    - name: Add Android Platform
      run: npx cap add android

    - name: Copy Web Assets to Android Project
      run: npx cap copy android

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
